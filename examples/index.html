<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ops Dashboard</title>
    <style>
      body { font: 14px/1.4 system-ui, sans-serif; margin: 0; }
      header { padding: 12px 16px; border-bottom: 1px solid #ddd; }
      main { display: flex; }
      #panels { flex: 1; padding: 16px; }
      #drawer-host { width: 320px; border-left: 1px solid #ddd; min-height: 60vh; }
      .report-drawer { padding: 12px; }
      .report-row { display: flex; justify-content: space-between; padding: 2px 0; }
      .live-tile { margin-top: 12px; font: 12px/1.5 ui-monospace, monospace; color: #555; }
      .feed-panel { margin-top: 12px; font: 12px/1.5 ui-monospace, monospace; color: #555; max-height: 240px; overflow: auto; }
      .report-footer { margin-top: 12px; height: 24px; border: 1px solid #bbb; background: #eee; cursor: pointer; }
    </style>
  </head>
  <body>
    <header>
      <strong>Ops Dashboard</strong>
      <button id="toggle-drawer" type="button">Report</button>
      <button id="toggle-ticker" type="button">Live</button>
      <button id="toggle-feed" type="button">Feed</button>
      <span id="poll-count">polls: 0</span>
    </header>
    <main>
      <div id="panels">
        <p>Throughput, latency and error panels would live here.</p>
        <div id="ticker-host"></div>
        <div id="feed-host"></div>
        <div id="pool-host"></div>
        <div id="shortcuts-host"></div>
      </div>
      <aside id="drawer-host"></aside>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
